name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t vaultfs:ci .

      - name: Boot stack and smoke test
        run: |
          docker compose up -d
          for i in {1..15}; do
            if curl -sf http://localhost:3000/health; then
              echo "App is healthy"
              exit 0
            fi
            echo "Waiting for app to be ready... ($i)"
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose logs
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v